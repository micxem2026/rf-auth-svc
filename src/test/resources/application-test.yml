spring:
  # Отключаем автоконфигурацию базы данных для тестов
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.cloud.config.client.ConfigClientAutoConfiguration

  # Используем in-memory базу данных для тестов
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

# Отключаем Eureka для тестов
eureka:
  client:
    enabled: false

# Отключаем Config Server для тестов
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: WARN
    org.springframework.security.oauth2: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
    me.rightsflow.auth: DEBUG

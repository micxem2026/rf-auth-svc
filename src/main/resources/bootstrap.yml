
server:
  port: 9000

spring:
  application:
    name: rf-auth-svc
  cloud:
    config:
      uri: ${RF_CONFIG_SERVICE_URL:http://localhost:8888}
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 0

eureka:
  instance:
    hostname: ${RF_AUTH_SVC_HOSTNAME:${hostname:localhost}}
  client:
    serviceUrl:
      defaultZone: ${RF_EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Управление пользователями и ролями</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="fas fa-users-cog me-2"></i>
            Управление пользователями и ролями
        </h2>
    </div>

    <ul class="nav nav-tabs" id="adminTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="users-tab" data-bs-toggle="tab" data-bs-target="#users-panel" type="button" role="tab">
                <i class="fas fa-users me-2"></i>Пользователи
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="roles-tab" data-bs-toggle="tab" data-bs-target="#roles-panel" type="button" role="tab">
                <i class="fas fa-user-tag me-2"></i>Роли
            </button>
        </li>
    </ul>

    <div class="tab-content" id="adminTabsContent">

        <div class="tab-pane fade show active" id="users-panel" role="tabpanel">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Список пользователей</h5>
                    <button class="btn btn-primary btn-sm" onclick="openAddUserModal()">
                        <i class="fas fa-user-plus me-2"></i>Добавить пользователя
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Display Name</th>
                                <th>Статус</th>
                                <th>Тип</th>
                                <th>Роли</th>
                                <th>Последний вход</th>
                                <th>Действия</th>
                            </tr>
                            </thead>
                            <tbody id="usersTableBody">

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>


        <div class="tab-pane fade" id="roles-panel" role="tabpanel">
            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">Список ролей</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Название роли</th>
                                        <th>Описание</th>
                                        <th>Действия</th>
                                    </tr>
                                    </thead>
                                    <tbody id="rolesTableBody">

                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">Добавить новую роль</h5>
                        </div>
                        <div class="card-body">
                            <form id="addRoleForm">
                                <div class="mb-3">
                                    <label for="roleName" class="form-label">Название (без ROLE_)</label>
                                    <input type="text" class="form-control" id="roleName" required>
                                </div>
                                <div class="mb-3">
                                    <label for="roleDescription" class="form-label">Описание</label>
                                    <textarea class="form-control" id="roleDescription" rows="3"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-plus me-2"></i>Добавить роль
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="userModalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username *</label>
                                    <input type="text" class="form-control" id="username" required>
                                </div>
                                <div class="mb-3">
                                    <label for="displayName" class="form-label">Display Name *</label>
                                    <input type="text" class="form-control" id="displayName" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email *</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Пароль</label>
                                    <input type="password" class="form-control" id="password">
                                    <div class="form-text" id="passwordHelp">Оставьте пустым, чтобы не менять.</div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Роли</label>
                                    <div id="rolesCheckboxes" class="border p-2 rounded" style="max-height: 150px; overflow-y: auto;">

                                        <div th:each="role : ${roles}" class="form-check">
                                            <input class="form-check-input" type="checkbox" th:value="${role.name}" th:id="'role_' + ${role.id}">
                                            <label class="form-check-label" th:for="'role_' + ${role.id}" th:text="${role.name}"></label>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="expirationDate" class="form-label">Дата истечения</label>
                                    <input type="datetime-local" class="form-control" id="expirationDate">
                                </div>
                                <div class="mb-3">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="enabled" checked>
                                        <label class="form-check-label" for="enabled">Активен (Enabled)</label>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="accountNonLocked" checked>
                                        <label class="form-check-label" for="accountNonLocked">Не заблокирован</label>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="accountNonExpired" checked>
                                        <label class="form-check-label" for="accountNonExpired">Не истек</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="handleSaveUser()">Сохранить</button>
                </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="deleteUserConfirmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Подтверждение удаления</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Вы уверены, что хотите удалить пользователя <strong id="deleteUsername"></strong>?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteUserBtn">Удалить</button>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">

    <script th:src="@{/js/users.js}"></script>
</th:block>

</body>
</html>

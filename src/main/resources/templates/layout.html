<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
                xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title ?: 'Authorization Server'}">Authorization Server</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-shield-alt me-2"></i>
            Authorization Server
        </a>
        <div class="navbar-nav ms-auto">
            <div sec:authorize="isAuthenticated()">
                    <span class="navbar-text me-3">
                        <i class="fas fa-user me-1"></i>
                        <span sec:authentication="name">User</span>
                    </span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link nav-link text-white p-0 border-0">
                        <i class="fas fa-sign-out-alt me-1"></i>
                        Выход
                    </button>
                </form>
            </div>
            <div sec:authorize="isAnonymous()">
                <a class="nav-link" href="/login">
                    <i class="fas fa-sign-in-alt me-1"></i>
                    Вход
                </a>
            </div>
        </div>
    </div>
</nav>

<main class="container mt-4">
    <div layout:fragment="content">

    </div>
</main>

<footer class="bg-light text-center py-3 mt-5">
    <div class="container">
        <small class="text-muted">
            © 2025 Authorization Server. Все права защищены.
        </small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/custom.js}"></script>
<script th:src="@{/js/oauth-functions.js}"></script>
</body>
</html>

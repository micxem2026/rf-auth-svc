plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'me.rightsflow'
version = '0.0.2-SNAPSHOT'
description = 'RightsFlow Auth Server'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.0.0")
	set('micrometerVersion', "1.5.5")
	name = 'RightsFlow Auth Server'
	sourceEncoding='UTF-8'
}

dependencies {

    implementation(platform("io.micrometer:micrometer-tracing-bom:${micrometerVersion}"))

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.security:spring-security-oauth2-authorization-server'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.postgresql:postgresql'

    // "Мост" между Micrometer (API метрик) и Prometheus (система мониторинга)
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Structured Logging
    implementation 'net.logstash.logback:logstash-logback-encoder:8.1'

    // Micrometer Tracing
    implementation 'io.micrometer:micrometer-tracing'
    implementation 'io.micrometer:micrometer-observation'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

	// Добавляем поддержку Thymeleaf
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

    // Spring Kafka (producer для событий инвалидации кэша прав)
    implementation 'org.springframework.kafka:spring-kafka'

    implementation 'org.owasp.encoder:encoder:1.4.0'

	testImplementation 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	//testImplementation 'org.testcontainers:junit-jupiter'
	//testImplementation 'org.testcontainers:postgresql'

    implementation 'org.webjars:swagger-ui:5.25.3'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}


tasks.named('test') {
	useJUnitPlatform()
}

bootJar {
	archiveBaseName = 'rf-auth-svc'
	archiveVersion = ''  // Убираем версию из имени файла
}

bootRun {
	systemProperties = System.properties as Map<String, ?>
}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-monitor
  namespace: develop
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: rf-auth-svc
  endpoints:
    - port: http
      path: /auth/actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s